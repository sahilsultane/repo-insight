# Server
server.port=${SERVER_PORT:8081}
spring.application.name=github-repo-insight

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repoinsight}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:repoinsight}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:repoinsight123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# GitHub
github.token=${GITHUB_TOKEN:}
github.api.base-url=https://api.github.com

# AI Provider: gemini or openai
ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:}
# URL is now managed inside GeminiProvider using the correct x-goog-api-key header
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# JWT
jwt.secret=${JWT_SECRET:defaultsecretkey_changeinproduction_must_be_256bits_long_1234567890}
jwt.expiration=86400000

# File Upload / Analysis workspace
analysis.workspace.dir=${TEMP_DIR:/tmp}/repo-workspaces
analysis.max-repo-size-mb=500
analysis.clone-timeout-seconds=120

# Async task executor timeout (10 minutes max per analysis)
spring.mvc.async.request-timeout=600000

# Logging
logging.level.com.githubrepoinsight=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
